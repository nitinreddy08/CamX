# Builds the debug APK and runs JVM unit tests on every push.
# Download the APK from the run page: Actions → latest "Android build" run → Artifacts → FilmCam-debug-apk.
name: Android build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK + unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log
      - name: Error summary
        if: failure()
        run: |
          echo "================ ERROR SUMMARY ================"
          grep -nE '^e: |error:|ERROR:|What went wrong|^> |Could not|failed|FAILED|Exception' build.log | grep -v '^\s*at ' | head -80 || true
          echo "--- context after 'What went wrong' ---"
          grep -A 25 'What went wrong' build.log | head -120 || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmCam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
